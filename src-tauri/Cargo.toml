[package]
name = "discord-cleaner"
version = "0.1.0"
description = "Clean up Discord on Windows: background helper, autostart, updater, unused modules and locales."
authors = ["Kydaix"]
license = "MIT"
repository = "https://github.com/Kydaix/Discord-Cleaner"
edition = "2021"

[lib]
name = "discord_cleaner_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"

[profile.release]
# LTO disabled on purpose: fat LTO cost ~2 min per CI release for ~100 KB.
lto = "off"
opt-level = 3
panic = "abort"
strip = true
