# Builds the portable exe and attaches it to a GitHub Release on every v* tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: cd src-tauri && cargo test --lib
      - run: npm run tauri build -- --no-bundle
      - run: Copy-Item src-tauri/target/release/discord-cleaner.exe DiscordCleaner.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create ${{ github.ref_name }} DiscordCleaner.exe --title "Discord Cleaner ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordCleaner
          path: DiscordCleaner.exe
