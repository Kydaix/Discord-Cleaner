# Every push to main becomes a release. The version is derived from the commit
# messages since the last tag (Conventional Commits):
#   "feat!: ..." or "BREAKING CHANGE" -> major, "feat: ..." -> minor, anything else -> patch.
# Add "[skip ci]" to a commit message to push without releasing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then echo "HEAD is already released"; exit 0; fi
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            v=0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log --format='%s%n%b' "$last..HEAD")
            if grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE' <<< "$log"; then v="$((major + 1)).0.0"
            elif grep -qE '^feat(\(.+\))?:' <<< "$log"; then v="$major.$((minor + 1)).0"
            else v="$major.$minor.$((patch + 1))"; fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "{\"version\":\"$v\"}" > version.json
          echo "Releasing v$v"
      - if: steps.version.outputs.version
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Rust ships preinstalled on windows-latest; installing a toolchain costs ~20 s per run.
      - if: steps.version.outputs.version
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.version.outputs.version
        run: npm install
      - if: steps.version.outputs.version
        run: cd src-tauri && cargo test --lib
      - if: steps.version.outputs.version
        run: npm run tauri build -- --no-bundle --config version.json
      - if: steps.version.outputs.version
        run: Copy-Item src-tauri/target/release/discord-cleaner.exe DiscordCleaner.exe
      - if: steps.version.outputs.version
        run: gh release create v${{ steps.version.outputs.version }} DiscordCleaner.exe --target ${{ github.sha }} --title "Discord Cleaner v${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
