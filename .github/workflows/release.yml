# Builds the Windows installer + portable exe and attaches them to a GitHub Release on every v* tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: cd src-tauri && cargo test --lib
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Discord Cleaner ${{ github.ref_name }}
          releaseDraft: true
      - name: Attach portable exe
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload ${{ github.ref_name }} src-tauri/target/release/discord-cleaner.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
