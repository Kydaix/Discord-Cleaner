name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Check release state
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test versioning and interrupted-release recovery
        run: node --test tests/release.test.mjs
      - name: Determine version and whether a build is needed
        id: version
        run: node .github/scripts/release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Test and build Windows executable
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      # Keep test assertions, but omit debug symbols to reduce linking and cache size.
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        env:
          # rust-cache hashes every installed toolchain; exclude the runner's changing defaults.
          RUSTUP_HOME: ${{ runner.temp }}/discord-cleaner-rustup
        run: |
          "RUSTUP_HOME=$env:RUSTUP_HOME" | Add-Content $env:GITHUB_ENV
          rustup toolchain install --no-self-update
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install locked npm dependencies
        run: npm ci
      - name: Type-check and build the interface
        run: npm run build
      - name: Test the interface in Edge with simulated Discord data
        run: npm run test:ux
      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked --lib
      - name: Configure the release version
        shell: pwsh
        run: |
          # The frontend was already built and tested above.
          @{ version = $env:RELEASE_VERSION; build = @{ beforeBuildCommand = "" } } |
            ConvertTo-Json | Set-Content -Encoding utf8 version.json
      - name: Build the portable executable and record compiler timings
        run: npm run tauri build -- --no-bundle --config version.json -- --locked --timings
      - name: Verify executable version and generate checksum
        shell: pwsh
        run: |
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Build changed a dependency lockfile" }
          $binary = Get-Item src-tauri/target/release/discord-cleaner.exe
          if ($binary.Length -eq 0 -or $binary.VersionInfo.ProductVersion -ne $env:RELEASE_VERSION) {
            throw "Missing executable or unexpected product version"
          }
          Copy-Item -LiteralPath $binary.FullName -Destination DiscordCleaner.exe
          $digest = (Get-FileHash DiscordCleaner.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest *DiscordCleaner.exe" | Set-Content -Encoding ascii DiscordCleaner.exe.sha256
          "Version: $env:RELEASE_VERSION | Executable: $($binary.Length) bytes | SHA-256: $digest" |
            Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Save the verified executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-executable
          path: |
            DiscordCleaner.exe
            DiscordCleaner.exe.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Save build timings and UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diagnostics
          path: |
            src-tauri/target/cargo-timings/
            ${{ runner.temp }}/discord-cleaner-ux-*.png
          retention-days: 7

  publish:
    name: Publish the verified executable
    needs: [prepare, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release script and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the verified executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-executable
          path: release-assets
      - name: Publish or resume an incomplete release
        working-directory: release-assets
        run: node ../.github/scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

  cleanup:
    name: Remove old releases and completed runs
    needs: [prepare, publish]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.prepare.result == 'success' &&
      (needs.publish.result == 'success' || needs.prepare.outputs.build == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout release script and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the latest release and this run
        run: node .github/scripts/release.mjs cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
