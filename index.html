<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Discord Cleaner</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <aside class="side">
      <div class="brand">
        <span class="logo"><svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><path d="M50 12 24 38l2 2 26-26zM22 40l-8 12 12-8z" fill="currentColor"/><path d="M12 52c-1-8 3-14 9-16l7 7c-2 6-8 10-16 9z" fill="currentColor" opacity=".7"/></svg></span>
        <div>
          <h1>Discord Cleaner</h1>
          <p class="hint" data-t="tagline"></p>
        </div>
      </div>
      <nav>
        <button type="button" data-page="cleaner">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          <span><b data-t="nav_cleaner"></b><small data-t="nav_cleaner_sub"></small></span>
        </button>
        <button type="button" data-page="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span><b data-t="nav_settings"></b><small data-t="nav_settings_sub"></small></span>
        </button>
        <button type="button" data-page="about">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
          <span><b data-t="nav_about"></b><small data-t="nav_about_sub"></small></span>
        </button>
      </nav>
      <div class="promo">
        <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><path d="M50 12 24 38l2 2 26-26zM22 40l-8 12 12-8z" fill="currentColor"/><path d="M12 52c-1-8 3-14 9-16l7 7c-2 6-8 10-16 9z" fill="currentColor" opacity=".7"/></svg>
        <p data-t="promo"></p>
      </div>
    </aside>
    <div class="content">
      <header class="top">
        <div>
          <h1 id="title"></h1>
          <p id="subtitle" class="hint"></p>
        </div>
        <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg><span data-t="pill"></span></span>
      </header>
      <main id="app"></main>
      <footer id="bar" hidden></footer>
    </div>
    <dialog id="review"></dialog>
  </body>
</html>
